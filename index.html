<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mausuf.</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#f8f6f2;
  --text:#111111;
  --muted:#777777;
  --line:#e8e4dc;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* TOP */

.top{
  padding:34px 28px;
}

.logo{
  width:42px;
  height:42px;
  object-fit:contain;
}

/* HERO */

.hero{
  padding:60px 28px 110px;
}

.content{
  max-width:760px;
  margin:auto;
}

.name{
  font-family:'Cormorant Garamond',serif;
  font-size:5.8rem;
  font-weight:500;
  letter-spacing:-2px;
  line-height:1;
}

.line{
  width:80px;
  height:1px;
  background:var(--text);
  margin:34px 0;
  opacity:0.2;
}

.bio{
  max-width:560px;
  font-size:1rem;
  line-height:2;
  color:var(--muted);
}

/* WORKS */

.works{
  max-width:760px;
  margin:auto;
  padding:0 28px 120px;
}

.section-title{
  font-size:0.78rem;
  text-transform:uppercase;
  letter-spacing:3px;
  margin-bottom:28px;
  color:var(--muted);
}

.works-list{
  display:flex;
  flex-direction:column;
}

.work-item{
  display:flex;
  align-items:center;
  gap:22px;

  padding:22px 0;

  text-decoration:none;
  color:var(--text);

  border-top:1px solid var(--line);

  font-family:'Cormorant Garamond',serif;
  font-size:2rem;

  transition:0.25s;
}

.work-item:last-child{
  border-bottom:1px solid var(--line);
}

.work-item span{
  font-family:'Inter',sans-serif;
  font-size:0.8rem;
  color:var(--muted);
  letter-spacing:2px;
}

.work-item:hover{
  padding-left:10px;
  color:#555;
}

/* FOOTER */

.footer{
  padding:40px 28px;
  border-top:1px solid var(--line);

  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:14px;
}

.footer-left{
  color:var(--muted);
  font-size:0.85rem;
}

.links{
  display:flex;
  gap:22px;
}

.links a{
  text-decoration:none;
  color:var(--text);
  font-size:0.9rem;
  opacity:0.7;
  transition:0.25s;
}

.links a:hover{
  opacity:1;
}

/* MOBILE */

@media(max-width:768px){

  .name{
    font-size:3.5rem;
  }

  .bio{
    font-size:0.96rem;
    line-height:1.9;
  }

  .work-item{
    font-size:1.5rem;
  }

}

</style>
</head>

<body>

<!-- TOP -->

<div class="top">
  <img src="logo.png" alt="Logo" class="logo">
</div>

<!-- HERO -->

<section class="hero">

  <div class="content">

    <div class="name">
      Mausuf.
    </div>

    <div class="line"></div>

    <div class="bio">
      Writer, observer, and civic voice interested in society,
      politics, culture, justice, and the human condition.
      Exploring ideas through advocacy, reflection,
      and public engagement.
    </div>

  </div>

</section>

<!-- WORKS -->

<section class="works">

  <div class="section-title">
    Works
  </div>

  <div class="works-list">

    <a href="article1.html" class="work-item">
      <span>01</span>
      Work 1
    </a>

    <a href="#" class="work-item">
      <span>02</span>
      Work 2
    </a>

    <a href="#" class="work-item">
      <span>03</span>
      Work 3
    </a>

    <a href="#" class="work-item">
      <span>04</span>
      Work 4
    </a>

  </div>

</section>

<!-- FOOTER -->

<footer class="footer">

  <div class="footer-left">
    Kathmandu, Nepal
  </div>

  <div class="links">
    <a href="#">Instagram</a>
    <a href="#">Twitter</a>
    <a href="#">Email</a>
  </div>

</footer>

</body>
</html>
