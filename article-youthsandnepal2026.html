<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Article</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        header {
            background-color: #222;
            color: white;
            padding: 15px;
            text-align: center;
        }

        header img {
            height: 50px;
            vertical-align: middle;
        }

        header h1 {
            display: inline;
            margin-left: 10px;
            font-size: 24px;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        h2 {
            color: #333;
        }

        p {
            line-height: 1.6;
            color: #555;
        }

        footer {
            text-align: center;
            padding: 10px;
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <!-- Replace logo.png with your logo file -->
        <img src="logo.png" alt="Logo">
        <h1>Your Website</h1>
    </header>

    <div class="container">
        <h2>Your Article Title</h2>
        <p><em>By You | Date</em></p>

        <p>
            Start writing your article here. This is your main content area.
            You can add as many paragraphs as you want.
        </p>

        <p>
            You can also structure your article with headings, quotes, or lists.
        </p>
    </div>

    <footer>
        © 2026 Your Name
    </footer>

</body>
</html>
